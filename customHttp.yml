customHeaders:
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '**/*.webp'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '**/*.webm'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '**/*.woff2'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '**'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin-allow-popups'

      - key: 'Cross-Origin-Resource-Policy'
        value: 'cross-origin'

      - key: 'Content-Security-Policy'
